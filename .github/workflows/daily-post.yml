name: TechBangla - Dual Blog Daily Automation

on:
  schedule:
    # Bangladesh 09:17 AM
    - cron: '17 3 * * *'
    # Bangladesh 09:17 PM
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techbangla-daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      BLOG_ID: ${{ secrets.BLOG_ID }}
      BLOG_ID_2: ${{ secrets.BLOG_ID_2 }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GEMINI_MODEL: gemini-3.5-flash-lite

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Python Setup
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ==========================================
      # 3. Dependencies
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install Pillow google-genai google-api-python-client google-auth requests beautifulsoup4

      # ==========================================
      # 4. Build runtime config
      # ==========================================
      - name: Build runtime config
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${GEMINI_API_KEY:-}" ] || { echo "::error::Missing secret GEMINI_API_KEY"; exit 1; }
          [ -n "${GOOGLE_CREDENTIALS_JSON:-}" ] || { echo "::error::Missing secret CREDENTIALS_JSON"; exit 1; }
          [ -n "${GOOGLE_TOKEN_JSON:-}" ] || { echo "::error::Missing secret TOKEN_JSON"; exit 1; }

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

          python - <<'PY'
          import os, json, textwrap
          from pathlib import Path

          config_text = f"""
          import os

          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "")
          GEMINI_MODEL = os.environ.get("GEMINI_MODEL", "gemini-3.5-flash-lite")
          BLOG_ID = os.environ.get("BLOG_ID", "")
          BLOG_ID_2 = os.environ.get("BLOG_ID_2", "")
          GITHUB_USERNAME = os.environ.get("GITHUB_USERNAME", "")
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
          GITHUB_REPO = os.environ.get("GITHUB_REPO", "")
          REPO_NAME = GITHUB_REPO
          CREDENTIALS_FILE = "credentials.json"
          TOKEN_FILE = "token.json"

          def __getattr__(name):
              if name.isupper():
                  return os.environ.get(name, "")
              raise AttributeError(name)
          """

          Path("config.py").write_text(textwrap.dedent(config_text).lstrip(), encoding="utf-8")
          print("Runtime config created successfully.")
          PY

      # ==========================================
      # 5. Check config imports
      # ==========================================
      - name: Check config imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          config = importlib.import_module("config")
          print("Config setup validated.")
          PY

      # ==========================================
      # 6. Model auto-update
      # ==========================================
      - name: Use supported Gemini model
        shell: bash
        run: |
          set -euo pipefail
          for f in *.py; do
            [ -f "$f" ] || continue
            [ "$f" = "config.py" ] && continue
            sed -i 's/gemini-2\.0-flash-lite/gemini-3.5-flash-lite/g' "$f"
            sed -i 's/gemini-2\.5-flash-lite/gemini-3.5-flash-lite/g' "$f"
          done

      # ==========================================
      # 7. Publish
      # ==========================================
      - name: Publish blog posts
        shell: bash
        run: |
          set -euo pipefail
          python main.py

      # ==========================================
      # 8. Clean temporary runtime files
      # ==========================================
      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f config.py
          rm -f credentials.json
          rm -f token.json

      # ==========================================
      # 9. Save bot state
      # ==========================================
      - name: Save bot state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/techbangla-state

          for f in posted_topics.json blog_posts.json; do
            if [ -f "$f" ]; then cp "$f" "/tmp/techbangla-state/$f"; fi
          done

          git reset --hard HEAD

          for f in posted_topics.json blog_posts.json; do
            if [ -f "/tmp/techbangla-state/$f" ]; then
              cp "/tmp/techbangla-state/$f" "$f" 2>/dev/null || cp "/tmp/techbangla-state/$f" "$f"
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bot state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
