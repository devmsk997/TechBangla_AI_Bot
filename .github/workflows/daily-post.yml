name: TechBangla - 2 Posts Daily

on:
  # Bangladesh time: 9:17 AM
  # Bangladesh time: 9:17 PM
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Dhaka'

    - cron: '17 21 * * *'
      timezone: 'Asia/Dhaka'

  # Manual Run workflow button-ও থাকবে
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techbangla-daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # GitHub Repository Secrets
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # আপনার GitHub secret-এর আসল নাম CREDENTIALS_JSON
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}

      # আপনার GitHub secret-এর আসল নাম TOKEN_JSON
      GOOGLE_TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      # GitHub নিজে automatically এই token দেয়
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # -------------------------------------------------
      # 1. Repository checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # 2. Python setup
      # -------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # -------------------------------------------------
      # 3. Install Python packages
      # -------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------
      # 4. Check GitHub secrets + create runtime files
      # -------------------------------------------------
      - name: Build private runtime files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required GitHub secrets..."

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing repository secret: GEMINI_API_KEY"
            exit 1
          fi

          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::Missing repository secret: CREDENTIALS_JSON"
            exit 1
          fi

          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing repository secret: TOKEN_JSON"
            exit 1
          fi

          echo "Required secrets found."

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

          # Runtime-only config.py
          cat > config.py <<'PY'
          import json
          import os

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")

          try:
              _oauth_raw = os.environ.get(
                  "GOOGLE_CREDENTIALS_JSON",
                  "{}"
              )

              _oauth = json.loads(_oauth_raw)
              _oauth = (
                  _oauth.get("installed")
                  or _oauth.get("web")
                  or {}
              )

              CLIENT_SECRET = _oauth.get(
                  "client_secret",
                  ""
              )

          except Exception:
              CLIENT_SECRET = ""
          PY

          echo "Runtime files created successfully."

      # -------------------------------------------------
      # 5. Replace old Gemini 2.0 models
      # -------------------------------------------------
      - name: Use supported Gemini model
        shell: bash
        run: |
          set -e

          for f in *.py; do
            [ -f "$f" ] || continue

            sed -i \
              's/gemini-2\.0-flash-lite/gemini-2.5-flash-lite/g' \
              "$f"

            sed -i \
              's/gemini-2\.0-flash/gemini-2.5-flash-lite/g' \
              "$f"
          done

          echo "Gemini model configuration checked."

      # -------------------------------------------------
      # 6. Run TechBangla bot
      # -------------------------------------------------
      - name: Publish one blog post
        shell: bash
        run: |
          set -e
          echo "Starting TechBangla blog publisher..."
          python main.py

      # -------------------------------------------------
      # 7. Remove private files
      # -------------------------------------------------
      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f config.py
          rm -f credentials.json
          rm -f token.json

          echo "Private runtime files removed."

      # -------------------------------------------------
      # 8. Save posted-topic state back to GitHub
      # -------------------------------------------------
      - name: Save bot state
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "posted_topics.json" ]; then
            git add posted_topics.json
          fi

          if [ -f "blog_posts.json" ]; then
            git add blog_posts.json
          fi

          if git diff --cached --quiet; then
            echo "No bot state changes to save."
            exit 0
          fi

          git commit -m "Update bot state [skip ci]"
          git push

          echo "Bot state saved successfully."
