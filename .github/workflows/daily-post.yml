name: TechBangla - 2 Posts Daily

on:
  schedule:
    # 03:17 UTC = 09:17 AM Bangladesh
    - cron: '17 3 * * *'

    # 15:17 UTC = 09:17 PM Bangladesh
    - cron: '17 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techbangla-daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      GOOGLE_CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Required by image_quality.py
          pip install Pillow

      # ==========================================
      # 4. Check required GitHub secrets
      # ==========================================
      - name: Check repository secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing secret: GEMINI_API_KEY"
            exit 1
          fi

          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::Missing secret: CREDENTIALS_JSON"
            exit 1
          fi

          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing secret: TOKEN_JSON"
            exit 1
          fi

          echo "Required secrets are available."

      # ==========================================
      # 5. Create Google OAuth runtime files
      # IMPORTANT: config.py is NOT overwritten
      # ==========================================
      - name: Build Google runtime files
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

          echo "credentials.json created."
          echo "token.json created."

      # ==========================================
      # 6. Verify original config.py
      # ==========================================
      - name: Check config file
        shell: bash
        run: |
          set -e

          if [ ! -f "config.py" ]; then
            echo "::error::config.py not found in repository."
            exit 1
          fi

          echo "Original config.py found."

          python - <<'PY'
          import config

          required = [
              "BLOG_ID",
              "GITHUB_USERNAME",
          ]

          missing = [
              name
              for name in required
              if not hasattr(config, name)
          ]

          if missing:
              raise RuntimeError(
                  "Missing variables in config.py: "
                  + ", ".join(missing)
              )

          print("config.py required variables OK.")
          PY

      # ==========================================
      # 7. Use Gemini 2.5 Flash Lite
      # ==========================================
      - name: Use supported Gemini model
        shell: bash
        run: |
          set -e

          for f in *.py; do
            [ -f "$f" ] || continue

            sed -i \
              's/gemini-2\.0-flash-lite/gemini-2.5-flash-lite/g' \
              "$f"

            sed -i \
              's/gemini-2\.0-flash/gemini-2.5-flash-lite/g' \
              "$f"
          done

          echo "Gemini model checked."

      # ==========================================
      # 8. Check Python packages
      # ==========================================
      - name: Check Python packages
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from PIL import Image
          import requests
          import google.auth

          print("Python packages OK.")
          PY

      # ==========================================
      # 9. Publish one blog post
      # ==========================================
      - name: Publish one blog post
        shell: bash
        run: |
          set -e

          echo "Starting TechBangla blog publisher..."
          python main.py

      # ==========================================
      # 10. Remove runtime secret files
      # ==========================================
      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f credentials.json
          rm -f token.json

          echo "Private runtime files removed."

      # ==========================================
      # 11. Save bot state
      # ==========================================
      - name: Save bot state
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "posted_topics.json" ]; then
            git add posted_topics.json
          fi

          if [ -f "blog_posts.json" ]; then
            git add blog_posts.json
          fi

          if git diff --cached --quiet; then
            echo "No bot state changes to save."
            exit 0
          fi

          git commit -m "Update bot state [skip ci]"
          git push

          echo "Bot state saved."
