name: TechBangla - 2 Posts Daily

on:
  # Bangladesh Time: 09:17 AM
  - schedule:
      - cron: '17 3 * * *'
      - cron: '17 15 * * *'

  # Manual run button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techbangla-daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Repository Secrets
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

      # GitHub automatically provides this token
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub repository information
      GITHUB_USERNAME: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # 2. Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ==================================================
      # 3. Dependencies
      # ==================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Make sure PIL is available
          pip install Pillow

      # ==================================================
      # 4. Create credentials + config.py
      # ==================================================
      - name: Build private runtime files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository secrets..."

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Missing secret: GEMINI_API_KEY"
            exit 1
          fi

          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::error::Missing secret: CREDENTIALS_JSON"
            exit 1
          fi

          if [ -z "${GOOGLE_TOKEN_JSON:-}" ]; then
            echo "::error::Missing secret: TOKEN_JSON"
            exit 1
          fi

          echo "All required secrets found."

          # Create Google OAuth files
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

          # Backup config.py if repository already contains one
          if [ -f "config.py" ]; then
            cp config.py .config.py.backup
          fi

          # Build runtime config
          cat > config.py <<'PY'
          import json
          import os

          # ==============================================
          # Gemini
          # ==============================================
          GEMINI_API_KEY = os.environ.get(
              "GEMINI_API_KEY",
              ""
          )

          # ==============================================
          # GitHub
          # ==============================================
          GITHUB_TOKEN = os.environ.get(
              "GITHUB_TOKEN",
              ""
          )

          GITHUB_USERNAME = os.environ.get(
              "GITHUB_USERNAME",
              ""
          )

          GITHUB_REPO = os.environ.get(
              "GITHUB_REPO",
              ""
          )

          # Some scripts may use REPO_NAME instead
          REPO_NAME = os.environ.get(
              "REPO_NAME",
              GITHUB_REPO
          )

          GITHUB_REPOSITORY = os.environ.get(
              "GITHUB_REPOSITORY",
              f"{GITHUB_USERNAME}/{GITHUB_REPO}"
          )

          GITHUB_BRANCH = os.environ.get(
              "GITHUB_REF_NAME",
              "main"
          )

          GITHUB_API_URL = os.environ.get(
              "GITHUB_API_URL",
              "https://api.github.com"
          )

          # ==============================================
          # Google OAuth
          # ==============================================
          CREDENTIALS_FILE = "credentials.json"
          TOKEN_FILE = "token.json"

          CLIENT_ID = ""
          CLIENT_SECRET = ""

          try:
              credentials_raw = os.environ.get(
                  "GOOGLE_CREDENTIALS_JSON",
                  "{}"
              )

              credentials_data = json.loads(
                  credentials_raw
              )

              oauth_data = (
                  credentials_data.get("installed")
                  or credentials_data.get("web")
                  or {}
              )

              CLIENT_ID = oauth_data.get(
                  "client_id",
                  ""
              )

              CLIENT_SECRET = oauth_data.get(
                  "client_secret",
                  ""
              )

          except Exception:
              CLIENT_ID = ""
              CLIENT_SECRET = ""
          PY

          echo "Runtime config created."

          echo "GitHub username: ${GITHUB_USERNAME}"
          echo "GitHub repo: ${GITHUB_REPO}"

      # ==================================================
      # 5. Gemini model
      # ==================================================
      - name: Use supported Gemini model
        shell: bash
        run: |
          set -e

          for f in *.py; do
            [ -f "$f" ] || continue

            sed -i \
              's/gemini-2\.0-flash-lite/gemini-2.5-flash-lite/g' \
              "$f"

            sed -i \
              's/gemini-2\.0-flash/gemini-2.5-flash-lite/g' \
              "$f"
          done

          echo "Gemini model checked."

      # ==================================================
      # 6. Check important Python imports
      # ==================================================
      - name: Check Python packages
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from PIL import Image
          import requests
          import google.auth

          print("Required Python packages OK.")
          PY

      # ==================================================
      # 7. Publish post
      # ==================================================
      - name: Publish one blog post
        shell: bash
        run: |
          set -e

          echo "Starting TechBangla blog publisher..."
          python main.py

      # ==================================================
      # 8. Remove secrets/runtime files
      # ==================================================
      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f credentials.json
          rm -f token.json

          if [ -f ".config.py.backup" ]; then
            mv .config.py.backup config.py
          else
            rm -f config.py
          fi

          echo "Private runtime files removed."

      # ==================================================
      # 9. Save bot state
      # ==================================================
      - name: Save bot state
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "posted_topics.json" ]; then
            git add posted_topics.json
          fi

          if [ -f "blog_posts.json" ]; then
            git add blog_posts.json
          fi

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git commit -m "Update bot state [skip ci]"
          git push

          echo "Bot state saved."
